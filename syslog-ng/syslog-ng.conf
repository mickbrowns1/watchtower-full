@version: 4.7
@include "scl.conf"

# ─── Global options ──────────────────────────────────────────────────────────
options {
    chain_hostnames(no);
    flush_lines(0);
    use_dns(no);
    use_fqdn(no);
    dns_cache(no);
    keep_hostname(yes);
    stats(freq(300));
    log_msg_size(65536);
};

# ─── Sources ─────────────────────────────────────────────────────────────────

# Accept syslog from the log-generator over TCP.
# The syslog() driver is purpose-built for RFC 5424 (IETF) and auto-detects
# RFC 6587 octet-counted framing — unlike network()+flags(syslog-protocol),
# which was falling back to legacy BSD parsing and mangling HOST/PROGRAM/MSGID.
source s_internal_tcp {
    syslog(
        transport("tcp")
        port(601)
        max-connections(100)
        # Explicit input window (100 per reader × 100 conns) so syslog-ng
        # doesn't auto-adjust and emit a startup notice.
        log-iw-size(10000)
    );
};

source s_udp {
    network(
        transport("udp")
        port(514)
    );
};

source s_self {
    internal();
};

# ─── Sourcetype mapping ───────────────────────────────────────────────────────
#
# Maps the RFC 5424 MSGID (set by the log generator) to a HEC sourcetype.
# Naming convention: <product>_ts_parser — DataPipeline uses the sourcetype to
# select (or auto-create) a parser of the same name. One sourcetype per
# datasource so each gets its own parser.
#
# MSGID          → sourcetype (== DataPipeline parser name)
# ─────────────────────────────────────────────────────────────────────────────
# PANW           → paloalto_ts_parser
# SSHD           → openssh_ts_parser
# SUDO           → sudo_ts_parser
# PAM            → pam_ts_parser
# HTTP           → apache_ts_parser
# CRON           → cron_ts_parser
# AUDIT          → linux_netfilter_ts_parser
# DUO            → cisco_duo_ts_parser
# PROXY          → zscaler_ts_parser
# DNS            → isc_bind_ts_parser
# EMAIL          → mimecast_ts_parser
# DBAUDIT        → postgresql_ts_parser
# WINEVENT       → windows_security_ts_parser
# CLOUDTRAIL     → aws_cloudtrail_ts_parser
# (anything else)→ syslog_generic_ts_parser
#
# Note: SentinelOne EDR events (msgid S1EDR) never reach syslog-ng at all --
# they're ingested directly into SDL by the generator, bypassing this pipeline
# entirely (see docker-compose.yml and STRONGISLAND_PIPELINE.md).

rewrite r_set_sourcetype {
    set("paloalto_ts_parser"        value("sourcetype") condition(match("^PANW$" value("MSGID"))));
    set("openssh_ts_parser"         value("sourcetype") condition(match("^SSHD$" value("MSGID"))));
    set("sudo_ts_parser"            value("sourcetype") condition(match("^SUDO$" value("MSGID"))));
    set("pam_ts_parser"             value("sourcetype") condition(match("^PAM$" value("MSGID"))));
    set("apache_ts_parser"          value("sourcetype") condition(match("^HTTP$" value("MSGID"))));
    set("cron_ts_parser"            value("sourcetype") condition(match("^CRON$" value("MSGID"))));
    set("linux_netfilter_ts_parser" value("sourcetype") condition(match("^AUDIT$" value("MSGID"))));
    set("cisco_duo_ts_parser"       value("sourcetype") condition(match("^DUO$" value("MSGID"))));
    set("zscaler_ts_parser"         value("sourcetype") condition(match("^PROXY$" value("MSGID"))));
    set("isc_bind_ts_parser"        value("sourcetype") condition(match("^DNS$" value("MSGID"))));
    set("mimecast_ts_parser"        value("sourcetype") condition(match("^EMAIL$" value("MSGID"))));
    set("postgresql_ts_parser"      value("sourcetype") condition(match("^DBAUDIT$" value("MSGID"))));
    set("windows_security_ts_parser" value("sourcetype") condition(match("^WINEVENT$" value("MSGID"))));
    set("aws_cloudtrail_ts_parser"   value("sourcetype") condition(match("^CLOUDTRAIL$" value("MSGID"))));
};

# Fallback — applied after r_set_sourcetype so it only fires when nothing matched
rewrite r_sourcetype_fallback {
    set("syslog_generic_ts_parser" value("sourcetype") condition(match("^$" value("sourcetype"))));
};

# Common enrichment tags
rewrite r_add_tags {
    set("strongisland-simulation" value("tags"));
    set("syslog-ng-forwarder"   value("agent"));
};

# ─── Destinations ────────────────────────────────────────────────────────────

# DataPipeline HEC endpoint
# Body is inlined — format-json JSON-escapes all values automatically.
# Batches up to 100 events (newline-delimited) or flushes every 5 s.
# Disk-buffer absorbs events during outages and replays on reconnect.
destination d_datapipeline_hec {
    http(
        url("`HEC_URL`")
        method("POST")
        headers(
            "Authorization: Splunk `HEC_TOKEN`"
            "Content-Type: application/json"
        )
        body("$(format-json time=${R_UNIXTIME} host=${HOST} event=${MESSAGE} fields.sourcetype=${sourcetype} fields.datasource=${PROGRAM} fields.agent=${agent} fields.tags=${tags} fields.msgid=${MSGID} fields.syslog_severity=${LEVEL} fields.syslog_facility=${FACILITY})\n")
        # One event per HEC POST — no batching, so every syslog line is ingested
        # as its own distinct event in DataPipeline (no risk of batch coalescing).
        # (Trailing \n above is kept as a belt-and-suspenders record delimiter.)
        batch-lines(1)
        batch-timeout(1000)
        tls(
            ca-dir("/etc/ssl/certs")
            peer-verify(yes)
        )
        disk-buffer(
            disk-buf-size(256M)
            reliable(yes)
            dir("/var/lib/syslog-ng/dp-queue")
        )
        timeout(30)
        retries(3)
    );
};

# Local fallback — raw syslog line written to file on disk
destination d_local_fallback {
    file(
        "/var/log/syslog-ng/fallback.log"
        template("${ISODATE} ${HOST} ${PROGRAM}[${PID}]: ${MESSAGE}\n")
        create-dirs(yes)
    );
};

destination d_stdout {
    file("/dev/stdout" template("${ISODATE} [syslog-ng] ${MESSAGE}\n"));
};

# ─── Log paths ───────────────────────────────────────────────────────────────

log {
    source(s_internal_tcp);
    source(s_udp);
    rewrite(r_set_sourcetype);
    rewrite(r_sourcetype_fallback);
    rewrite(r_add_tags);
    destination(d_datapipeline_hec);
    destination(d_local_fallback);
    flags(flow-control);
};

log {
    source(s_self);
    destination(d_stdout);
};
